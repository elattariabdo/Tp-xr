<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TP1 - Realite augmentee avec model-viewer</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
 body { font-family: system-ui, sans-serif; margin: 0; }
 h1 { font-size: 20px; margin: 10px 16px; }
 model-viewer { width: 100%; height: 70vh; background: #f0f0f0; }
 #bouton-ar { background: #0a58ca; color: #fff; border: 0; border-radius: 8px;
  padding: 14px 20px; font-size: 18px; position: absolute; bottom: 16px; left: 16px; }
</style>
</head>
<body>
<h1>Modele 3D : touchez "Voir dans votre espace"</h1>

<model-viewer src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
  alt="Un astronaute en 3D" ar ar-modes="webxr scene-viewer quick-look"
  ar-scale="auto" ar-placement="floor" camera-controls touch-action="pan-y" shadow-intensity="1">
  <button slot="ar-button" id="bouton-ar">Voir dans votre espace</button>
</model-viewer>

<p style="margin:12px 16px">Si le bouton n'apparait pas : votre telephone ou navigateur ne gere pas l'AR avec cette methode.</p>
</body>
</html>
